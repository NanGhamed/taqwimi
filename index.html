<!doctype html>

<title>تقويمي — مؤتمر ومعرض الحج النسخة السادسة</title>
<meta name="description" content="تقويمي: منظّم حضور مؤتمر ومعرض الحج النسخة السادسة. استعرض البرنامج، حدّد أولوياتك، دوّن ملاحظاتك، وتابع حضورك — يعمل دون اتصال.">
<meta name="theme-color" content="#5C3B4E">

<body>

<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <img class="brand-mark" src="icons/icon-192.png" alt="" width="40" height="40">
      <div class="brand-text">
        <span class="brand-title">تقويمي</span>
        <span class="brand-sub">مؤتمر ومعرض الحج النسخة السادسة</span>
      </div>
    </div>

    <nav class="navtabs" aria-label="التنقل الرئيسي">
      <button class="navtab" data-route="program" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg>
        <span>البرنامج</span>
      </button>
      <button class="navtab" data-route="my" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-bookmark"></use></svg>
        <span>تقويمي</span>
      </button>
      <button class="navtab" data-route="settings" type="button">
        <svg class="ic" aria-hidden="true"><use href="#i-settings"></use></svg>
        <span>الإعدادات</span>
      </button>
    </nav>

    <div class="histbtns" aria-label="التنقل بين الصفحات">
      <button class="histbtn" id="btn-back" type="button" title="رجوع" aria-label="رجوع">
        <svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg>
      </button>
      <button class="histbtn" id="btn-forward" type="button" title="تقدّم" aria-label="تقدّم">
        <svg class="ic" aria-hidden="true"><use href="#i-forward"></use></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<div class="floaters" aria-hidden="false">
  <button class="fab fab-install hidden" id="btn-install" type="button" title="تثبيت التطبيق" aria-label="تثبيت التطبيق">
    <svg class="ic" aria-hidden="true"><use href="#i-phone"></use></svg>
    <span class="badge-dot" aria-hidden="true"></span>
  </button>
  <button class="fab fab-top" id="btn-top" type="button" title="العودة إلى الأعلى" aria-label="العودة إلى الأعلى">
    <svg class="ic" aria-hidden="true"><use href="#i-up"></use></svg>
  </button>
</div>

<div id="install-host"></div>
<div id="toast-host" aria-live="polite" aria-atomic="false"></div>
<div id="modal-host"></div>
